<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="레시피">
<meta name="theme-color" content="#ff6b35">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>레시피 추출</title>
<style>
  :root { --bg:#fff; --fg:#1c1c1e; --muted:#6e6e73; --line:#e5e5ea; --chip:#f2f2f7; --accent:#ff6b35; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f7; --muted:#98989d; --line:#2c2c2e; --chip:#1c1c1e; } }
  body { font:16px/1.5 -apple-system,sans-serif; background:var(--bg); color:var(--fg); margin:0 auto; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); max-width:640px; }
  form { display:flex; gap:8px; }
  input, select { font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; min-width:0; }
  input { flex:1; }
  button { font:inherit; padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  button.link { background:none; color:var(--accent); padding:4px 8px; }
  a { color:var(--accent); }
  h1 { font-size:22px; margin:20px 0 4px; } h2 { font-size:18px; margin:24px 0 8px; }
  .meta, .muted { color:var(--muted); font-size:14px; }
  ul { padding:0; list-style:none; margin:0; } li { padding:8px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
  ol { padding-left:20px; } ol li { display:list-item; border:0; padding:6px 0; }
  .ts { color:var(--accent); font-variant-numeric:tabular-nums; text-decoration:none; }
  .err { color:#d70015; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:12px 0; margin:0 -16px; padding-left:16px; padding-right:16px; }
  .chip { flex:none; padding:6px 14px; border-radius:999px; background:var(--chip); color:var(--fg); border:0; font-size:15px; }
  .chip.on { background:var(--accent); color:#fff; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .item { display:block; text-decoration:none; color:var(--fg); padding:12px 0; border-bottom:1px solid var(--line); }
  .banner { background:var(--chip); border-radius:10px; padding:10px 12px; margin-top:12px; font-size:14px; }
</style>
</head>
<body>
<form id="f">
  <input id="u" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="유튜브/인스타 영상 링크 붙여넣기" required>
  <button id="b">추출</button>
</form>
<div id="jobs"></div>
<div id="main"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get: k => { try { return localStorage[k] || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage[k] = v; } catch {} } };

// ---- API (토큰이 없거나 틀리면 한 번 물어봄)
async function api(path, method = 'GET', body) {
  for (let tries = 0; tries < 2; tries++) {
    const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', 'X-Token': store.get('token') }, body: body && JSON.stringify(body) });
    if (r.status === 401 && tries === 0) {
      const t = prompt('접근 토큰을 입력하세요');
      if (!t) throw new Error('접근 토큰이 필요합니다');
      store.set('token', t.trim()); continue;
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || r.status);
    return d;
  }
}

// ---- 상태
let lib = { folders: [], recipes: [], jobs: [] };
let cur = store.get('cur') || 'all';   // 'all' | 'none' | 폴더 id
let timer;

async function loadLib() { lib = await api('/api/library'); renderJobs(); }

function renderJobs() {
  $('jobs').innerHTML = lib.jobs.map(j => j.status === 'error'
    ? `<div class="banner err">실패: ${esc(j.error)} <button class="link" onclick="dismiss('${j.id}')">닫기</button></div>`
    : `<div class="banner">분석 중… <span class="muted">${esc(j.url)}</span></div>`).join('');
}
async function dismiss(id) { await api('/api/job/' + id, 'DELETE'); await loadLib(); }

// ---- 목록 화면
async function showList() {
  clearInterval(timer);
  try { await loadLib(); } catch (e) { $('main').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  if (cur !== 'all' && cur !== 'none' && !lib.folders.some(f => f.id === cur)) cur = 'all';
  const fname = id => (lib.folders.find(f => f.id === id) || {}).name;
  const shown = lib.recipes.filter(r => cur === 'all' || (cur === 'none' ? !r.folder_id : r.folder_id === cur));
  const chip = (id, label) => `<button class="chip ${cur === id ? 'on' : ''}" onclick="setCur('${id}')">${esc(label)}</button>`;
  $('main').innerHTML = `
    <div class="chips">${chip('all', `전체 ${lib.recipes.length}`)}${chip('none', '분류 안 됨')}
      ${lib.folders.map(f => chip(f.id, f.name)).join('')}
      <button class="chip" onclick="addFolder()">+ 폴더</button></div>
    ${cur.length > 4 ? `<div class="row muted"><span>폴더: ${esc(fname(cur))}</span>
      <span><button class="link" onclick="renameFolder()">이름 변경</button><button class="link" onclick="delFolder()">삭제</button></span></div>` : ''}
    ${shown.length ? shown.map(r => `<a class="item" href="#r/${r.id}"><div>${esc(r.title)}</div>
      <div class="muted">${new Date(r.created).toLocaleDateString('ko-KR')}${cur === 'all' && r.folder_id ? ' · ' + esc(fname(r.folder_id)) : ''}</div></a>`).join('')
      : '<p class="muted">저장된 레시피가 없습니다. 위에 링크를 붙여넣어 보세요.</p>'}`;
  if (lib.jobs.some(j => j.status === 'pending')) timer = setTimeout(() => !location.hash && showList(), 4000);
}
function setCur(id) { cur = id; store.set('cur', id); showList(); }
async function addFolder() { const name = prompt('새 폴더 이름'); if (!name) return; const f = await api('/api/folders', 'POST', { name }); setCur(f.id); }
async function renameFolder() {
  const old = lib.folders.find(f => f.id === cur).name, name = prompt('폴더 이름 변경', old);
  if (name && name !== old) { await api('/api/folders/' + cur, 'PATCH', { name }); showList(); }
}
async function delFolder() {
  if (!confirm('폴더를 삭제할까요? 안의 레시피는 삭제되지 않고 "분류 안 됨"으로 이동합니다.')) return;
  await api('/api/folders/' + cur, 'DELETE'); setCur('all');
}

// ---- 레시피 화면
const ing = i => `<li><span>${esc(i.name)}</span><span class="muted">${esc(i.amount)}</span></li>`;
function tsLink(url, ts) {
  const m = /^(\d+):(\d+)$/.exec(ts || ''); if (!m) return '';
  const sec = +m[1] * 60 + +m[2];
  const href = /youtu/.test(url) ? url + (url.includes('?') ? '&' : '?') + 't=' + sec : url;
  return `<a class="ts" href="${esc(href)}" target="_blank">${ts}</a> `;
}
async function showRecipe(id) {
  clearInterval(timer); clearTimeout(timer);
  $('main').innerHTML = '<p class="muted">불러오는 중…</p>';
  try {
    const [r] = await Promise.all([api('/api/recipes/' + id), lib.folders.length ? 0 : loadLib()]);
    $('main').innerHTML = `
      <div class="row" style="margin-top:12px"><a href="#">← 목록</a>
        <span><select onchange="move('${r.id}', this.value)"><option value="">분류 안 됨</option>
          ${lib.folders.map(f => `<option value="${f.id}" ${f.id === r.folder_id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>
        <button class="link" onclick="delRecipe('${r.id}')">삭제</button></span></div>
      <h1>${esc(r.title)}</h1>
      <div class="meta">${esc(r.servings)} · 약 ${r.minutes}분 · <a href="${esc(r.url)}" target="_blank">원본 영상</a></div>
      <h2>재료</h2><ul>${r.ingredients.map(ing).join('')}</ul>
      ${r.sections.map(s => `<h2>${esc(s.title)}</h2><ol>${s.steps.map(st =>
        `<li>${tsLink(r.url, st.timestamp)}${esc(st.text)}${st.ingredients.length ? `<div class="muted">${st.ingredients.map(i => esc(i.name + ' ' + i.amount)).join(', ')}</div>` : ''}</li>`).join('')}</ol>`).join('')}
      ${r.tips.length ? `<h2>팁</h2><ul>${r.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}`;
  } catch (e) { $('main').innerHTML = `<p class="err">${esc(e.message)}</p><a href="#">← 목록</a>`; }
}
async function move(id, folder_id) { await api('/api/recipes/' + id, 'PATCH', { folder_id }); lib.folders.length = 0; await loadLib(); }
async function delRecipe(id) { if (confirm('이 레시피를 삭제할까요?')) { await api('/api/recipes/' + id, 'DELETE'); location.hash = ''; } }

// ---- 추출
async function go(url) {
  $('b').disabled = true; $('jobs').innerHTML = '<div class="banner">분석 중… (30초~2분, 화면을 켜 두세요)</div>';
  try {
    let d = await api('/api/recipe', 'POST', { url, folder_id: cur.length > 4 ? cur : null });
    const id = d.id;  // job 응답에는 id가 없으므로 따로 보관
    while (d.status === 'pending') {  // 짧은 요청을 반복해 Safari/프록시 타임아웃을 피함
      await new Promise(r => setTimeout(r, 3000));
      d = await api('/api/job/' + id);
    }
    if (d.status === 'error') throw new Error(d.error);
    $('u').value = ''; lib.folders.length = 0; location.hash = '#r/' + d.recipe.id; route();
  } catch (e) { $('jobs').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  $('b').disabled = false;
}

function route() { const m = /^#r\/(\w+)/.exec(location.hash); m ? showRecipe(m[1]) : showList(); }
addEventListener('hashchange', route);
$('f').onsubmit = e => { e.preventDefault(); go($('u').value.trim()); };

// ?token=, ?url= (단축어/공유에서 열릴 때)
const qs = new URLSearchParams(location.search);
if (qs.get('token')) store.set('token', qs.get('token'));
if (qs.has('token') || qs.has('url')) history.replaceState(null, '', location.pathname + location.hash);
route();
if (qs.get('url')) { $('u').value = qs.get('url'); go(qs.get('url')); }
</script>
</body>
</html>
